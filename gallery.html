<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   MOBILE MENU
========================= */

function toggleMenu(menu) {

const nav =
document.querySelector("header nav");

nav.classList.toggle("show");

menu.classList.toggle("active");

}


document
.querySelectorAll("nav ul li a")
.forEach(function(link) {

link.addEventListener("click", function() {

const nav =
document.querySelector("header nav");

const menu =
document.querySelector(".menu-toggle");

nav.classList.remove("show");

menu.classList.remove("active");

});

});



/* =========================
   DROPDOWN
========================= */

const dropdownButton =
document.getElementById("categoryDropdownBtn");

const dropdownMenu =
document.getElementById("categoryDropdownMenu");

const selectedCategory =
document.getElementById("selectedCategory");

const options =
document.querySelectorAll(".category-option");

const galleryItems =
document.querySelectorAll(".gallery-item");


dropdownButton.addEventListener(
"click",
function(event) {

event.stopPropagation();

dropdownMenu.classList.toggle("show");

dropdownButton.classList.toggle("open");

});



/* =========================
   FILTER
========================= */

options.forEach(function(option) {

option.addEventListener(
"click",
function(event) {

event.stopPropagation();


const category =
this.getAttribute("data-category");


options.forEach(function(item) {

item.classList.remove("active");

});


this.classList.add("active");


selectedCategory.textContent =
this.textContent.trim();


dropdownMenu.classList.remove("show");

dropdownButton.classList.remove("open");


galleryItems.forEach(function(item) {

const itemCategory =
item.getAttribute("data-category");


if (
category === "all" ||
itemCategory === category
) {

item.style.display = "block";

} else {

item.style.display = "none";

}

});

});

});



/* =========================
   CLOSE DROPDOWN
========================= */

document.addEventListener(
"click",
function(event) {

if (
!dropdownButton.contains(event.target) &&
!dropdownMenu.contains(event.target)
) {

dropdownMenu.classList.remove("show");

dropdownButton.classList.remove("open");

}

});



/* =========================
   IMAGE PREVIEW
========================= */

const galleryGrid =
document.getElementById("galleryGrid");

const galleryOverlay =
document.getElementById("galleryOverlay");

const galleryPreview =
document.getElementById("galleryPreview");


galleryGrid.addEventListener(
"click",
function(event) {

const image =
event.target.closest(".gallery-item img");


if (!image) {

return;

}


galleryPreview.src =
image.src;

galleryPreview.alt =
image.alt;

galleryOverlay.classList.add("show");

});



/* =========================
   CLOSE PREVIEW
   CLICK IMAGE AGAIN
========================= */

galleryPreview.addEventListener(
"click",
function() {

galleryOverlay.classList.remove("show");

galleryPreview.src = "";

});



/* =========================
   CLOSE OUTSIDE
========================= */

galleryOverlay.addEventListener(
"click",
function(event) {

if (
event.target === galleryOverlay
) {

galleryOverlay.classList.remove("show");

galleryPreview.src = "";

}

});

</script>
