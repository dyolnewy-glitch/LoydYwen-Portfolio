<!-- =========================
     PORTFOLIO SECTION
========================= -->

<section class="portfolio">

<div class="portfolio-header">

<div>

<h1>
My Portfolio
</h1>

<p>
Projects, designs, and applications I created during my IT journey.
</p>

</div>

<button
class="add-project-btn"
onclick="openProjectModal()">

* Add Project

</button>

</div>

<!-- PROJECT DISPLAY -->

<div
class="project-container"
id="projectContainer">

</div>

<!-- NO PROJECT MESSAGE -->

<div id="noProject">

No project added yet.

</div>

</section>

<!-- =========================
     ADD / EDIT PROJECT MODAL
========================= -->

<div
class="project-modal"
id="projectModal">

<div class="project-box">

<h2 id="modalTitle">

Add Project

</h2>

<!-- PROJECT IMAGE -->

<label>
Project Image / Logo
</label>

<input
type="file"
id="projectImage"
accept="image/*">

<div class="image-preview">

<img
id="imagePreview"
alt="Project Preview">

</div>

<!-- PROJECT TITLE -->

<label>
Project Title
</label>

<input
type="text"
id="projectTitle"
placeholder="Project Name">

<!-- CATEGORY -->

<label>
Category
</label>

<select id="projectCategory">

<option value="">
Select Category
</option>

<option value="Mobile Application">
Mobile Application
</option>

<option value="Web System">
Web System
</option>

<option value="UI/UX Design">
UI/UX Design
</option>

<option value="Graphic Design">
Graphic Design
</option>

<option value="Capstone Project">
Capstone Project
</option>

<option value="Other">
Other
</option>

</select>

<!-- PROJECT STATUS -->

<label>
Project Status
</label>

<select id="projectStatus">

<option value="">
Select Status
</option>

<option value="Completed">
Completed
</option>

<option value="Ongoing">
Ongoing
</option>

<option value="Concept">
Concept
</option>

</select>

<!-- DESCRIPTION -->

<label>
Description
</label>

<textarea
id="projectDescription"
placeholder="Short project description">
</textarea>

<!-- TOOLS -->

<label>
Tools Used / Technology
</label>

<input
type="text"
id="projectTools"
placeholder="Example: Flutter, Dart, Firebase">

<!-- PROJECT LINK -->

<label>
Project Link
</label>

<input
type="url"
id="projectLink"
placeholder="https://example.com">

<!-- MODAL BUTTONS -->

<div class="modal-buttons">

<button
type="button"
class="save-btn"
onclick="saveProject()">

Save

</button>

<button
type="button"
class="cancel-btn"
onclick="closeProjectModal()">

Cancel

</button>

</div>

</div>

</div>

<!-- =========================
     HEADER MENU SCRIPT
========================= -->

<script>

function toggleMenu(menu) {

const nav = document.querySelector("header nav");

nav.classList.toggle("show");

menu.classList.toggle("active");

}


document.querySelectorAll("nav ul li a")
.forEach(link => {

link.addEventListener("click", () => {

document.querySelector("header nav")
.classList.remove("show");

document.querySelector(".menu-toggle")
.classList.remove("active");

});

});

</script>
